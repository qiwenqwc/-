<style>

    /* ==========================================
       自己選擇的日期
       ========================================== */

    .selected-date {
        background-color: #ef4444 !important;
        color: white !important;
    }


    /* ==========================================
       其他人選擇的日期
       ========================================== */

    .disabled-by-others {
        background-color: #d1d5db !important;
        color: #9ca3af !important;
        text-decoration: line-through;
        cursor: not-allowed !important;
    }


    /* ==========================================
       月曆基本設定
       ========================================== */

    #calendar-grid {

        -webkit-user-select: none;
        user-select: none;

        -webkit-touch-callout: none;

        -webkit-tap-highlight-color: transparent;
    }


    /*
     * 日期格
     *
     * manipulation 可以讓手機正常觸發 click
     */

    #calendar-grid div[data-date] {

        -webkit-user-select: none;
        user-select: none;

        touch-action: manipulation;

        -webkit-tap-highlight-color: transparent;
    }


    /*
     * 防止手機選取文字
     */

    body {

        -webkit-user-select: none;
        user-select: none;
    }


    /*
     * select 必須允許正常操作
     */

    select {

        -webkit-user-select: auto;
        user-select: auto;

        touch-action: manipulation;
    }


    /*
     * 按鈕允許正常點擊
     */

    button {

        touch-action: manipulation;
    }

</style>

<!-- ==========================================

<div class="max-w-md mx-auto min-h-screen bg-white shadow-lg flex flex-col">

    <!-- ==========================================

    <section id="app-section"
             class="p-4 flex-1 flex flex-col hidden">


        <!-- 使用者資訊 -->

        <div class="flex justify-between items-center mb-3">

            <span class="text-sm font-medium text-gray-600">

                目前身分：

                </strong>

            </span>

                    class="text-xs text-gray-500 underline">

            </button>

        </div>



        <!-- ======================================

        <div class="flex justify-around text-xs mb-3 bg-gray-100 p-2 rounded">

        <!-- ======================================

        <button id="submit-btn"
                onclick="submitData()"

<script>


    // ==================================================
    // Google Apps Script Web App URL
    // ==================================================

    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyXsRlU9BUAIfOwg3MCR4Io4LzzuWsMiv9UZd99tKLsUrjbCCmljPACwMYfZmMuf0HTUw/exec";



    // ==================================================
    // 全域變數
    // ==================================================

    let currentUser = "";

    let selectedDates = new Set();

    let allUsersData = {};

    let currentYear;

    let currentMonth;

    let isDataFetched = false;



    // ==================================================
    // 建立月曆
    // ==================================================

    function initCalendar() {


        const now = new Date();


        currentYear =
            now.getFullYear();


        currentMonth =
            now.getMonth();



        // 標題

        document.getElementById(
            "month-title"
        ).innerText =
            `${currentYear} 年 ${currentMonth + 1} 月份行程`;



        // 本月第一天星期幾

        const firstDay =
            new Date(
                currentYear,
                currentMonth,
                1
            ).getDay();



        // 本月總天數

        const totalDays =
            new Date(
                currentYear,
                currentMonth + 1,
                0
            ).getDate();



        const grid =
            document.getElementById(
                "calendar-grid"
            );


        grid.innerHTML = "";



        // ==================================================
        // 補前面的空白
        // ==================================================

        for (
            let i = 0;
            i < firstDay;
            i++
        ) {

            const emptyCell =
                document.createElement("div");


            emptyCell.className =
                "bg-white p-3";


            grid.appendChild(
                emptyCell
            );
        }



        // ==================================================
        // 建立日期
        // ==================================================

        for (
            let day = 1;
            day <= totalDays;
            day++
        ) {


            const dateStr =
                `${currentYear}-${String(currentMonth + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;



            const cell =
                document.createElement("div");


            cell.className =
                "bg-white py-4 flex items-center justify-center cursor-pointer select-none transition";



            cell.innerText =
                day;



            cell.dataset.date =
                dateStr;



            // ==================================================
            // ★ 每個日期直接綁定 click
            //
            // 這是手機短按的主要處理方式
            // ==================================================

            cell.addEventListener(
                "click",
                function(e) {


                    // 如果剛剛是拖曳
                    // 不要再觸發點擊

                    if (
                        window.calendarWasDragging
                    ) {

                        window.calendarWasDragging =
                            false;

                        return;
                    }



                    // 其他人已選
                    // 完全不能操作

                    if (
                        isDateDisabledByOthers(
                            dateStr
                        )
                    ) {

                        return;
                    }



                    // ==================================================
                    // 點一下：
                    //
                    // 沒選 → 選取
                    // 已選 → 取消
                    // ==================================================

                    if (
                        selectedDates.has(
                            dateStr
                        )
                    ) {

                        selectedDates.delete(
                            dateStr
                        );

                    } else {

                        selectedDates.add(
                            dateStr
                        );
                    }



                    updateCalendarUI();

                }
            );



            grid.appendChild(
                cell
            );
        }



        // 建立拖曳事件

        setupDragEvents(grid);

    }



    // ==================================================
    // 判斷某一天是不是其他人已經選擇
    // ==================================================

    function isDateDisabledByOthers(
        dateStr
    ) {


        for (
            const user in allUsersData
        ) {


            // 排除目前使用者

            if (
                user === currentUser
            ) {

                continue;
            }



            const dates =
                allUsersData[user];



            if (
                Array.isArray(dates) &&
                dates.includes(dateStr)
            ) {

                return true;
            }
        }


        return false;
    }



    // ==================================================
    // 拖曳選取系統
    // ==================================================

    function setupDragEvents(
        grid
    ) {


        let isDragging =
            false;


        let dragMode =
            null;


        let hasMoved =
            false;


        let startX =
            0;


        let startY =
            0;



        // ==================================================
        // 找出目前手指 / 滑鼠所在的日期
        // ==================================================

        function getCellFromPoint(
            x,
            y
        ) {


            const element =
                document.elementFromPoint(
                    x,
                    y
                );


            if (!element) {
                return null;
            }


            return element.closest(
                "#calendar-grid div[data-date]"
            );
        }



        // ==================================================
        // 處理日期
        // ==================================================

        function processDate(
            dateStr
        ) {


            if (!dateStr) {
                return;
            }



            // 其他人日期
            // 直接跳過

            if (
                isDateDisabledByOthers(
                    dateStr
                )
            ) {

                return;
            }



            const cell =
                grid.querySelector(
                    `[data-date="${dateStr}"]`
                );


            if (!cell) {
                return;
            }



            if (
                dragMode === "add"
            ) {

                selectedDates.add(
                    dateStr
                );

            }


            else if (
                dragMode === "remove"
            ) {

                selectedDates.delete(
                    dateStr
                );
            }



            updateCalendarUI();
        }



        // ==================================================
        // 手機 Touch Start
        // ==================================================

        grid.addEventListener(
            "touchstart",
            function(e) {


                const touch =
                    e.touches[0];


                const cell =
                    e.target.closest(
                        "#calendar-grid div[data-date]"
                    );


                if (!cell) {
                    return;
                }



                const dateStr =
                    cell.dataset.date;



                // 其他人日期
                // 不可以開始拖曳

                if (
                    isDateDisabledByOthers(
                        dateStr
                    )
                ) {

                    return;
                }



                isDragging =
                    true;


                hasMoved =
                    false;



                startX =
                    touch.clientX;


                startY =
                    touch.clientY;



                // 已選 → 取消

                // 未選 → 選取

                dragMode =
                    selectedDates.has(
                        dateStr
                    )
                        ? "remove"
                        : "add";

            },
            {
                passive: true
            }
        );



        // ==================================================
        // 手機 Touch Move
        // ==================================================

        grid.addEventListener(
            "touchmove",
            function(e) {


                if (!isDragging) {
                    return;
                }



                const touch =
                    e.touches[0];



                const dx =
                    Math.abs(
                        touch.clientX -
                        startX
                    );


                const dy =
                    Math.abs(
                        touch.clientY -
                        startY
                    );



                // 超過 8px
                // 才算拖曳

                if (
                    dx > 8 ||
                    dy > 8
                ) {

                    hasMoved =
                        true;

                    window.calendarWasDragging =
                        true;
                }



                if (!hasMoved) {
                    return;
                }



                const cell =
                    getCellFromPoint(
                        touch.clientX,
                        touch.clientY
                    );


                if (!cell) {
                    return;
                }



                const dateStr =
                    cell.dataset.date;



                // 其他人日期
                // 跳過

                if (
                    isDateDisabledByOthers(
                        dateStr
                    )
                ) {

                    return;
                }



                processDate(
                    dateStr
                );

            },
            {
                passive: true
            }
        );



        // ==================================================
        // 手機 Touch End
        // ==================================================

        grid.addEventListener(
            "touchend",
            function() {


                if (!isDragging) {
                    return;
                }



                /*
                 *
                 * ★ 注意
                 *
                 * 短按不在 touchend 選取。
                 *
                 * 短按由日期格自己的 click 處理。
                 *
                 */



                isDragging =
                    false;


                dragMode =
                    null;


                startX =
                    0;


                startY =
                    0;


                hasMoved =
                    false;

            }
        );



        // ==================================================
        // 電腦 Mouse Down
        // ==================================================

        grid.addEventListener(
            "mousedown",
            function(e) {


                if (
                    e.button !== 0
                ) {

                    return;
                }



                const cell =
                    e.target.closest(
                        "#calendar-grid div[data-date]"
                    );


                if (!cell) {
                    return;
                }



                const dateStr =
                    cell.dataset.date;



                // 其他人日期不能操作

                if (
                    isDateDisabledByOthers(
                        dateStr
                    )
                ) {

                    return;
                }



                isDragging =
                    true;


                hasMoved =
                    false;


                window.calendarWasDragging =
                    false;



                dragMode =
                    selectedDates.has(
                        dateStr
                    )
                        ? "remove"
                        : "add";



                e.preventDefault();

            }
        );



        // ==================================================
        // 電腦 Mouse Move
        // ==================================================

        grid.addEventListener(
            "mousemove",
            function(e) {


                if (!isDragging) {
                    return;
                }



                const cell =
                    e.target.closest(
                        "#calendar-grid div[data-date]"
                    );


                if (!cell) {
                    return;
                }



                hasMoved =
                    true;


                window.calendarWasDragging =
                    true;



                const dateStr =
                    cell.dataset.date;



                // 其他人日期跳過

                if (
                    isDateDisabledByOthers(
                        dateStr
                    )
                ) {

                    return;
                }



                processDate(
                    dateStr
                );

            }
        );



        // ==================================================
        // 電腦 Mouse Up
        // ==================================================

        document.addEventListener(
            "mouseup",
            function() {


                if (!isDragging) {
                    return;
                }



                isDragging =
                    false;


                dragMode =
                    null;


                hasMoved =
                    false;

            }
        );

    }



    // ==================================================
    // 進入 App
    // ==================================================

    async function enterApp() {


        const select =
            document.getElementById(
                "user-select"
            );


        if (!select.value) {

            alert(
                "請先選擇你的暱稱！"
            );

            return;
        }



        currentUser =
            select.value;



        document.getElementById(
            "current-user-tag"
        ).innerText =
            currentUser;



        const enterBtn =
            document.getElementById(
                "enter-btn"
            );



        // ==================================================
        // 第一次進入
        // ==================================================

        if (!isDataFetched) {


            enterBtn.innerText =
                "載入雲端資料中...";


            enterBtn.disabled =
                true;



            await fetchLatestData();



            enterBtn.innerText =
                "進入填寫";


            enterBtn.disabled =
                false;


            isDataFetched =
                true;

        }


        // ==================================================
        // 已經取得資料
        // ==================================================

        else {

            loadUserDataToLocal();

            updateCalendarUI();
        }



        // 顯示月曆

        document.getElementById(
            "login-section"
        ).classList.add(
            "hidden"
        );


        document.getElementById(
            "app-section"
        ).classList.remove(
            "hidden"
        );

    }



    // ==================================================
    // 切換身分
    // ==================================================

    function logout() {


        currentUser =
            "";


        selectedDates.clear();



        document.getElementById(
            "app-section"
        ).classList.add(
            "hidden"
        );


        document.getElementById(
            "login-section"
        ).classList.remove(
            "hidden"
        );


        // 清除選單

        document.getElementById(
            "user-select"
        ).value = "";

    }



    // ==================================================
    // 從 Google Apps Script 取得資料
    // ==================================================

    async function fetchLatestData() {


        try {


            const response =
                await fetch(
                    WEB_APP_URL,
                    {
                        method: "GET",
                        redirect: "follow"
                    }
                );



            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}`
                );
            }



            const result =
                await response.json();



            allUsersData =
                result || {};



            loadUserDataToLocal();

            updateCalendarUI();


        } catch (error) {


            console.error(
                "讀取資料失敗",
                error
            );


            alert(
                "無法取得雲端資料，請檢查網路連線或 API 網址。"
            );

        }

    }



    // ==================================================
    // 載入目前使用者資料
    // ==================================================

    function loadUserDataToLocal() {


        selectedDates.clear();



        if (
            allUsersData[currentUser] &&
            Array.isArray(
                allUsersData[currentUser]
            )
        ) {


            allUsersData[currentUser].forEach(
                function(date) {

                    selectedDates.add(
                        date
                    );

                }
            );
        }

    }



    // ==================================================
    // 更新月曆 UI
    // ==================================================

    function updateCalendarUI() {


        const cells =
            document.querySelectorAll(
                "#calendar-grid div[data-date]"
            );



        cells.forEach(
            function(cell) {


                const dateStr =
                    cell.dataset.date;



                // ==================================================
                // 重設基本樣式
                // ==================================================

                cell.className =
                    "bg-white py-4 flex items-center justify-center cursor-pointer select-none transition";



                // ==================================================
                // 自己選的日期
                // ==================================================

                if (
                    selectedDates.has(
                        dateStr
                    )
                ) {


                    cell.classList.add(
                        "selected-date"
                    );


                    return;
                }



                // ==================================================
                // 其他人選的日期
                // ==================================================

                if (
                    isDateDisabledByOthers(
                        dateStr
                    )
                ) {


                    cell.classList.add(
                        "disabled-by-others"
                    );


                    cell.classList.remove(
                        "cursor-pointer"
                    );

                }

            }
        );

    }



    // ==================================================
    // 送出資料
    // ==================================================

    async function submitData() {


        const submitBtn =
            document.getElementById(
                "submit-btn"
            );


        const datesArray =
            Array.from(
                selectedDates
            );



        // ==================================================
        // 更新本地資料
        // ==================================================

        allUsersData[currentUser] =
            datesArray;


        updateCalendarUI();



        // ==================================================
        // POST Payload
        // ==================================================

        const payload = {

            user:
                currentUser,

            dates:
                datesArray

        };



        try {


            submitBtn.innerText =
                "儲存中...";


            submitBtn.disabled =
                true;



            const response =
                await fetch(
                    WEB_APP_URL,
                    {
                        method: "POST",

                        body:
                            JSON.stringify(
                                payload
                            ),

                        redirect:
                            "follow"
                    }
                );



            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}`
                );
            }



            alert(
                "儲存成功！"
            );


        } catch (error) {


            console.error(
                "儲存失敗",
                error
            );


            alert(
                "儲存失敗，請再試一次。"
            );


        } finally {


            submitBtn.innerText =
                "確認送出（覆蓋紀錄）";


            submitBtn.disabled =
                false;

        }

    }



    // ==================================================
    // 啟動月曆
    // ==================================================

    initCalendar();

</script>
