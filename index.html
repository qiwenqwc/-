<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>每月份日期避開系統</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .selected-date {
            background-color: #ef4444 !important;
            color: white !important;
        }

        .disabled-by-others {
            background-color: #d1d5db !important;
            color: #9ca3af !important;
            text-decoration: line-through;
            cursor: not-allowed !important;
        }

        #calendar-grid {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 讓日期格阻擋手勢引發的頁面滾動，專注於滑動選取 */
        #calendar-grid div[data-date] {
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            -webkit-user-select: none;
            user-select: none;
        }

        select {
            -webkit-user-select: auto;
            user-select: auto;
            touch-action: manipulation;
        }

        button {
            touch-action: manipulation;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased select-none">

    <div class="max-w-md mx-auto min-h-screen bg-white shadow-lg flex flex-col">

        <!-- 標題 -->
        <header class="bg-blue-600 text-white p-4 text-center">
            <h1 id="month-title" class="text-xl font-bold">載入中...</h1>
            <p class="text-xs mt-1 text-blue-100">點擊或滑過選擇你「不可以」的日子</p>
        </header>

        <!-- 登入 / 選擇身分 -->
        <section id="login-section" class="p-6 flex-1 flex flex-col justify-center">
            <h2 class="text-lg font-semibold mb-4 text-center">請選擇你的暱稱</h2>
            <select id="user-select" class="w-full p-3 border border-gray-300 rounded-lg mb-4 text-lg bg-white">
                <option value="">-- 請選擇身分 --</option>
                <option value="Qi">Qi</option>
                <option value="Han">Han</option>
                <option value="Zhang">Zhang</option>
                <option value="Hsieh">Hsieh</option>
            </select>
            <button id="enter-btn" onclick="enterApp()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold shadow hover:bg-blue-700 transition">
                進入填寫
            </button>
        </section>

        <!-- 月曆區域 -->
        <section id="app-section" class="p-4 flex-1 flex flex-col hidden">
            <div class="flex justify-between items-center mb-3">
                <span class="text-sm font-medium text-gray-600">
                    目前身分：<strong id="current-user-tag" class="text-blue-600"></strong>
                </span>
                <button onclick="logout()" class="text-xs text-gray-500 underline">切換身分</button>
            </div>

            <!-- 圖例 -->
            <div class="flex justify-around text-xs mb-3 bg-gray-100 p-2 rounded">
                <div class="flex items-center">
                    <span class="w-3 h-3 bg-red-500 inline-block rounded-sm mr-1"></span>你選的不行
                </div>
                <div class="flex items-center">
                    <span class="w-3 h-3 bg-gray-300 inline-block rounded-sm mr-1"></span>其他人不行
                </div>
                <div class="flex items-center">
                    <span class="w-3 h-3 bg-white border inline-block rounded-sm mr-1"></span>雙方皆可
                </div>
            </div>

            <!-- 月曆表格 -->
            <div class="border rounded-lg overflow-hidden flex-1 shadow-sm">
                <div class="grid grid-cols-7 bg-gray-100 text-center text-xs font-bold text-gray-600 py-2">
                    <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-px bg-gray-200 text-center text-sm"></div>
            </div>

            <button id="submit-btn" onclick="submitData()" class="mt-4 w-full bg-green-600 text-white py-3 rounded-lg font-bold shadow hover:bg-green-700 transition">
                確認送出（覆蓋紀錄）
            </button>
        </section>

    </div>

    <script>
        // ==================================================
        // 請在此貼上你的 Google Apps Script 正式部署網址 (/exec 結尾)
        // ==================================================
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzXHBHac9fxAXQSr7T9H-hfHfYtioSpcvCsfvCnXfd6dwQcN_Pnu7v-hZT6MN1i4-Llhg/exec";

        let currentUser = "";
        let selectedDates = new Set();
        let allUsersData = {};
        let currentYear, currentMonth;
        let isDataFetched = false;

        function initCalendar() {
            const now = new Date();
            currentYear = now.getFullYear();
            currentMonth = now.getMonth();

            document.getElementById("month-title").innerText = `${currentYear} 年 ${currentMonth + 1} 月份行程`;

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
            const grid = document.getElementById("calendar-grid");
            grid.innerHTML = "";

            // 填充前導空白格
            for (let i = 0; i < firstDay; i++) {
                const emptyCell = document.createElement("div");
                emptyCell.className = "bg-white p-3";
                grid.appendChild(emptyCell);
            }

            // 建立當月日期
            for (let day = 1; day <= totalDays; day++) {
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
                const cell = document.createElement("div");
                cell.className = "bg-white py-4 flex items-center justify-center cursor-pointer select-none transition";
                cell.innerText = day;
                cell.dataset.date = dateStr;
                grid.appendChild(cell);
            }

            // 啟動點擊與滑動統一觸控事件
            setupDragAndClickEvents(grid);
        }

        function isDateDisabledByOthers(dateStr) {
            for (const user in allUsersData) {
                if (user === currentUser) continue;
                const dates = allUsersData[user];
                if (Array.isArray(dates) && dates.includes(dateStr)) {
                    return true;
                }
            }
            return false;
        }

        // ==================================================
        // 點擊與滑動選取 統一處理系統 (門檻判定)
        // ==================================================
function setupDragAndClickEvents(grid) {
    let isPressing = false;
    let dragMode = null;      
    let startX = 0;
    let startY = 0;
    let startCellDate = null;
    let isDragged = false;
    const MOVE_THRESHOLD = 15; // ★ 加大到 15px，提高點擊判定成功率

    function getCellFromPoint(x, y) {
        const element = document.elementFromPoint(x, y);
        return element ? element.closest("#calendar-grid div[data-date]") : null;
    }

    function processDate(dateStr, mode) {
        if (!dateStr || isDateDisabledByOthers(dateStr)) return;

        if (mode === "add") {
            selectedDates.add(dateStr);
        } else if (mode === "remove") {
            selectedDates.delete(dateStr);
        }
        updateCalendarUI();
    }

    function handleStart(clientX, clientY, target) {
        const cell = target.closest("#calendar-grid div[data-date]");
        if (!cell) return;

        const dateStr = cell.dataset.date;
        if (isDateDisabledByOthers(dateStr)) return;

        isPressing = true;
        isDragged = false;
        startX = clientX;
        startY = clientY;
        startCellDate = dateStr;

        dragMode = selectedDates.has(dateStr) ? "remove" : "add";
    }

    function handleMove(clientX, clientY) {
        if (!isPressing) return;

        const dx = Math.abs(clientX - startX);
        const dy = Math.abs(clientY - startY);

        // 超過門檻才進入滑動選取
        if (dx > MOVE_THRESHOLD || dy > MOVE_THRESHOLD) {
            if (!isDragged) {
                isDragged = true;
                processDate(startCellDate, dragMode);
            }

            const cell = getCellFromPoint(clientX, clientY);
            if (cell) {
                processDate(cell.dataset.date, dragMode);
            }
        }
    }

    function handleEnd(clientX, clientY) {
        if (!isPressing) return;

        const dx = Math.abs(clientX - startX);
        const dy = Math.abs(clientY - startY);

        // ★ 位移在門檻內，且沒進入滑動狀態 -> 100% 觸發點擊變色
        if (!isDragged && dx <= MOVE_THRESHOLD && dy <= MOVE_THRESHOLD && startCellDate) {
            if (selectedDates.has(startCellDate)) {
                selectedDates.delete(startCellDate);
            } else {
                selectedDates.add(startCellDate);
            }
            updateCalendarUI();
        }

        // 重置狀態
        isPressing = false;
        isDragged = false;
        dragMode = null;
        startCellDate = null;
    }

    // --- 觸控事件 (Mobile) ---
    grid.addEventListener("touchstart", (e) => {
        if (e.touches.length > 1) return; // 忽略多指觸控
        const touch = e.touches[0];
        handleStart(touch.clientX, touch.clientY, e.target);
    }, { passive: true });

    grid.addEventListener("touchmove", (e) => {
        if (!isPressing) return;
        const touch = e.touches[0];
        handleMove(touch.clientX, touch.clientY);
        
        // 如果已經在滑動選取了，防止瀏覽器頁面跟著上下滾動
        if (isDragged && e.cancelable) {
            e.preventDefault();
        }
    }, { passive: false }); // ★ 設為 false 才能在需要時 preventDefault

    grid.addEventListener("touchend", (e) => {
        if (!isPressing) return;
        const touch = e.changedTouches[0]; // ★ 從 changedTouches 拿放開時的座標
        handleEnd(touch.clientX, touch.clientY);
    });

    // --- 滑鼠事件 (Desktop) ---
    grid.addEventListener("mousedown", (e) => {
        if (e.button !== 0) return;
        handleStart(e.clientX, e.clientY, e.target);
    });

    grid.addEventListener("mousemove", (e) => {
        handleMove(e.clientX, e.clientY);
    });

    document.addEventListener("mouseup", (e) => {
        if (isPressing) {
            handleEnd(e.clientX, e.clientY);
        }
    });
}
        async function enterApp() {
            const select = document.getElementById("user-select");
            if (!select.value) {
                alert("請先選擇你的暱稱！");
                return;
            }

            currentUser = select.value;
            document.getElementById("current-user-tag").innerText = currentUser;

            const enterBtn = document.getElementById("enter-btn");

            if (!isDataFetched) {
                enterBtn.innerText = "載入雲端資料中...";
                enterBtn.disabled = true;

                await fetchLatestData();

                enterBtn.innerText = "進入填寫";
                enterBtn.disabled = false;
                isDataFetched = true;
            } else {
                loadUserDataToLocal();
                updateCalendarUI();
            }

            document.getElementById("login-section").classList.add("hidden");
            document.getElementById("app-section").classList.remove("hidden");
        }

        function logout() {
            currentUser = "";
            selectedDates.clear();
            document.getElementById("app-section").classList.add("hidden");
            document.getElementById("login-section").classList.remove("hidden");
            document.getElementById("user-select").value = "";
        }

        async function fetchLatestData() {
            if (!WEB_APP_URL || WEB_APP_URL === "XXX") {
                alert("請將程式碼中的 WEB_APP_URL 替換為有效的 Apps Script 網址！");
                loadUserDataToLocal();
                updateCalendarUI();
                return;
            }

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: "GET",
                    redirect: "follow"
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const result = await response.json();
                allUsersData = result || {};
                loadUserDataToLocal();
                updateCalendarUI();

            } catch (error) {
                console.error("讀取資料失敗", error);
                alert("無法取得雲端資料，請確認 API 網址或權限設定為「所有人」。");
                loadUserDataToLocal();
                updateCalendarUI();
            }
        }

        function loadUserDataToLocal() {
            selectedDates.clear();
            if (allUsersData[currentUser] && Array.isArray(allUsersData[currentUser])) {
                allUsersData[currentUser].forEach(date => selectedDates.add(date));
            }
        }

        function updateCalendarUI() {
            const cells = document.querySelectorAll("#calendar-grid div[data-date]");
            cells.forEach(cell => {
                const dateStr = cell.dataset.date;
                cell.className = "bg-white py-4 flex items-center justify-center cursor-pointer select-none transition";

                if (selectedDates.has(dateStr)) {
                    cell.classList.add("selected-date");
                    return;
                }

                if (isDateDisabledByOthers(dateStr)) {
                    cell.classList.add("disabled-by-others");
                    cell.classList.remove("cursor-pointer");
                }
            });
        }

        async function submitData() {
            const submitBtn = document.getElementById("submit-btn");
            const datesArray = Array.from(selectedDates);

            allUsersData[currentUser] = datesArray;
            updateCalendarUI();

            const payload = { user: currentUser, dates: datesArray };

            try {
                submitBtn.innerText = "儲存中...";
                submitBtn.disabled = true;

                const response = await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify(payload),
                    redirect: "follow"
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                alert("儲存成功！");
            } catch (error) {
                console.error("儲存失敗", error);
                alert("儲存失敗，請再試一次。");
            } finally {
                submitBtn.innerText = "確認送出（覆蓋紀錄）";
                submitBtn.disabled = false;
            }
        }

        initCalendar();
    </script>
</body>
</html>
