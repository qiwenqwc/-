<!DOCTYPE html><html lang="zh-TW"><head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>每月份日期避開系統</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

.selected-date { background-color: #ef4444 !important; color: white !important; }

.disabled-by-others { background-color: #d1d5db !important; color: #9ca3af !important; text-decoration: line-through; cursor: not-allowed; }

</style></head><body class="bg-gray-50 text-gray-800 font-sans antialiased">



<div class="max-w-md mx-auto min-h-screen bg-white shadow-lg flex flex-col">

<header class="bg-blue-600 text-white p-4 text-center">

<h1 id="month-title" class="text-xl font-bold">載入中...</h1>

<p class="text-xs mt-1 text-blue-100">點擊或滑動選擇你「不可以」的日子</p>

</header>



<section id="login-section" class="p-6 flex-1 flex flex-col justify-center">

<h2 class="text-lg font-semibold mb-4 text-center">請選擇你的暱稱</h2>
<h2 class="text-lg font-semibold mb-4 text-center">請選擇您的暱稱</h2>

<select id="user-select" class="w-full p-3 border rounded-lg mb-4 text-lg bg-white shadow-sm">

<option value="">-- 請選擇身分 --</option>

<option value="琪">琪</option>

<option value="涵吉">涵吉</option>

<option value="阿謝">阿謝</option>

<option value="阿張">阿張</option>

</select>

<button onclick="enterApp()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold shadow hover:bg-blue-700 transition">進入填寫</button>

</section>



<section id="app-section" class="p-4 flex-1 flex flex-col hidden">

<div class="flex justify-between items-center mb-3">

<span class="text-sm font-medium text-gray-600">目前身分：<strong id="current-user-tag" class="text-blue-600"></strong></span>

<button onclick="logout()" class="text-xs text-gray-500 underline">切換身分</button>

</div>



<div class="flex justify-around text-xs mb-3 bg-gray-100 p-2 rounded">

<div class="flex items-center"><span class="w-3 h-3 bg-red-500 inline-block rounded-sm mr-1"></span>你選的不行</div>

<div class="flex items-center"><span class="w-3 h-3 bg-gray-300 inline-block rounded-sm mr-1"></span>其他人不行</div>

<div class="flex items-center"><span class="w-3 h-3 bg-white border inline-block rounded-sm mr-1"></span>雙方皆可</div>

</div>



<div class="border rounded-lg overflow-hidden flex-1 shadow-sm">

<div class="grid grid-cols-7 bg-gray-100 text-center text-xs font-bold text-gray-600 py-2">

<span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
<span>日</span><span><span>一二</span></span><span><span><span>三四五</span></span></span><span>六</span>

</div>

<div id="calendar-grid" class="grid grid-cols-7 gap-px bg-gray-200 text-center text-sm">

</div>

</div>



<button onclick="submitData()" class="mt-4 w-full bg-green-600 text-white py-3 rounded-lg font-bold shadow hover:bg-green-700 transition">

確認送出（覆蓋紀錄）

</button>

</section>

</div>



<script>

// 【設定】請將部署好的 Google Apps Script Web App URL 貼在下方

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzXHBHac9fxAXQSr7T9H-hfHfYtioSpcvCsfvCnXfd6dwQcN_Pnu7v-hZT6MN1i4-Llhg/exec";



let currentUser = "";

let selectedDates = new Set(); // 存放自己選的不行日期 (格式: YYYY-MM-DD)

let allUsersData = {}; // 存放所有人選的資料 { "成員1": ["2026-06-01", ...], ... }

let currentYear, currentMonth;



// 初始化月曆網格

function initCalendar() {

const now = new Date();

currentYear = now.getFullYear();

currentMonth = now.getMonth(); // 0-11



document.getElementById('month-title').innerText = `${currentYear} 年 ${currentMonth + 1} 月份行程`;



const firstDay = new Date(currentYear, currentMonth, 1).getDay();

const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();



const grid = document.getElementById('calendar-grid');

grid.innerHTML = '';



// 填入空白格 (上個月尾巴)

for (let i = 0; i < firstDay; i++) {

const emptyCell = document.createElement('div');

emptyCell.className = 'bg-white p-3';

grid.appendChild(emptyCell);

}



// 填入當月日期

for (let day = 1; day <= totalDays; day++) {

const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

const cell = document.createElement('div');

cell.className = 'bg-white py-4 flex items-center justify-center cursor-pointer select-none transition active:bg-red-100';

cell.innerText = day;
cell.innerText = 日期;

cell.dataset.date = dateStr;



// 綁定點擊與滑動選擇事件 (支援手機手指拖曳)

cell.addEventListener('pointerdown', (e) => {

e.preventDefault();

toggleDateSelection(dateStr, cell);

});


grid.appendChild(cell);

}

}



// 切換日期選取狀態

function toggleDateSelection(dateStr, cellElement) {

if (selectedDates.has(dateStr)) {
如果 (selectedDates.has(dateStr)) {

selectedDates.delete(dateStr);

cellElement.classList.remove('selected-date');

} else {
} 別的 {

selectedDates.add(dateStr);

cellElement.classList.add('selected-date');

}

}



async function enterApp() {
非同步函數 enterApp() {

const select = document.getElementById('user-select');

if (!select.value) {
如果 (!select.value) {

alert('請先選擇你的暱稱！');

return;   返回;

}

currentUser = select.value;

document.getElementById('current-user-tag').innerText = currentUser;



document.getElementById('login-section').classList.add('hidden');

document.getElementById('app-section').classList.remove('hidden');



await fetchLatestData();

}



function logout() {

currentUser = "";

selectedDates.clear();

document.getElementById('app-section').classList.add('hidden');

document.getElementById('login-section').classList.remove('hidden');

}



// 從 Google 試算表抓取最新資料

async function fetchLatestData() {
非同步函數 fetchLatestData() {

try {   嘗試 {

const response = await fetch(WEB_APP_URL);

const result = await response.json();

allUsersData = result || {};



// 恢復自己的選項

selectedDates.clear();

if (allUsersData[currentUser]) {
如果 (allUsersData[currentUser]) {

allUsersData[currentUser].forEach(d => selectedDates.add(d));

}



updateCalendarUI();

} catch (error) {

console.error('讀取資料失敗', error);

alert('無法取得雲端資料，請檢查網路或設定。');

}

}



// 更新月曆畫面顯示（結合自己與其他人選的結果）

function updateCalendarUI() {

// 收集其他所有人不能的日子

const othersDisabled = new Set();

for (let user in allUsersData) {

if (user !== currentUser) {
如果 (user !== currentUser) {

allUsersData[user].forEach(d => othersDisabled.add(d));

}

}



const cells = document.querySelectorAll('#calendar-grid div[data-date]');

cells.forEach(cell => {

const dateStr = cell.dataset.date;

cell.className = 'bg-white py-4 flex items-center justify-center cursor-pointer select-none transition';



if (selectedDates.has(dateStr)) {
如果 (selectedDates.has(dateStr)) {

cell.classList.add('selected-date'); // 自己選的不行
cell.classList.add('選取日期'); // 自己選不了

} else if (othersDisabled.has(dateStr)) {

cell.classList.add('disabled-by-others'); // 其他人不行

}

});

}



// 送出資料至 Google 試算表（覆蓋該用戶記錄）

async function submitData() {

const payload = {

user: currentUser,   用戶：當前用戶，

dates: Array.from(selectedDates)

};



try {   嘗試 {

document.querySelector('button[onclick="submitData"]').innerText = '儲存中...';

await fetch(WEB_APP_URL, {

method: 'POST',   方法：'POST'，

body: JSON.stringify(payload)

});

alert('儲存成功！');

await fetchLatestData();

} catch (error) {

console.error('儲存失敗', error);

alert('儲存失敗，請再試一次。');

} finally {
} 最後 {

document.querySelector('button[onclick="submitData"]').innerText = '確認送出（覆蓋紀錄）';
document.querySelector('button[onclick="submitData"]').innerText = '確認發送（覆蓋記錄）';

}

}



initCalendar();   初始化日曆();

</script></body></html>
