    <script src="https://cdn.tailwindcss.com"></script>

    <style>

        /* ================================
           已選日期
        ================================= */

            background-color: #ef4444 !important;
            color: white !important;
        }


        /* ================================
           其他人已選日期
        ================================= */
        .disabled-by-others {
            background-color: #d1d5db !important;
            color: #9ca3af !important;
            text-decoration: line-through;
            cursor: not-allowed !important;
        }


        /* ================================
           月曆整體
        ================================= */

        #calendar-grid {
            -webkit-user-select: none;
            user-select: none;

            /*
             * 非常重要：
             * 阻止手機在月曆上滑動時整個頁面跟著滾動
             */
            touch-action: none;

            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }


        /* ================================
           日期格
        ================================= */

        #calendar-grid div[data-date] {
            -webkit-user-select: none;
            user-select: none;

            touch-action: none;

            -webkit-tap-highlight-color: transparent;

            /*
             * 增加點擊區域
             */
            min-height: 58px;
        }


        /* ================================
           Body
        ================================= */

        body {
            -webkit-user-select: none;
            user-select: none;
        }


        /* ================================
           Select
        ================================= */

        select {
            -webkit-user-select: auto;
            user-select: auto;
            touch-action: manipulation;
        }


        /* ================================
           Button
        ================================= */

        button {
            touch-action: manipulation;
        }


        /* ================================
           點擊時不要出現瀏覽器預設效果
        ================================= */

        #calendar-grid div[data-date]:active {
            opacity: 0.75;
        }

    </style>
</head>


<body class="bg-gray-50 text-gray-800 font-sans antialiased select-none">

    <div class="max-w-md mx-auto min-h-screen bg-white shadow-lg flex flex-col">

        <!-- =====================================

            <div class="flex justify-between items-center mb-3">

            <!-- =====================================

            <div class="flex justify-around text-xs mb-3 bg-gray-100 p-2 rounded">

                <!-- 日期 -->

                <div id="calendar-grid"
                     class="grid grid-cols-7 gap-px bg-gray-200 text-center text-sm">

                </div>

            </div>



            <!-- =====================================
                 送出
            ====================================== -->

            <button id="submit-btn"
                    onclick="submitData()"
                    class="mt-4 w-full bg-green-600 text-white py-3 rounded-lg font-bold shadow hover:bg-green-700 transition">

                確認送出（覆蓋紀錄）

            </button>

        </section>

    </div>



<script>


/* ============================================================
   Google Apps Script API
============================================================ */

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbzXHBHac9fxAXQSr7T9H-hfHfYtioSpcvCsfvCnXfd6dwQcN_Pnu7v-hZT6MN1i4-Llhg/exec";


/* ============================================================
   全域變數
============================================================ */

let currentUser = "";

let selectedDates = new Set();

let allUsersData = {};

let currentYear;

let currentMonth;

let isDataFetched = false;



/* ============================================================
   建立月曆
============================================================ */

function initCalendar() {

    const now = new Date();

    currentYear = now.getFullYear();

    currentMonth = now.getMonth();


    document.getElementById("month-title").innerText =
        `${currentYear} 年 ${currentMonth + 1} 月份行程`;


    const firstDay =
        new Date(
            currentYear,
            currentMonth,
            1
        ).getDay();


    const totalDays =
        new Date(
            currentYear,
            currentMonth + 1,
            0
        ).getDate();


    const grid =
        document.getElementById("calendar-grid");


    grid.innerHTML = "";


    /* =====================================
       前面的空白日期
    ====================================== */

    for (let i = 0; i < firstDay; i++) {

        const emptyCell =
            document.createElement("div");

        emptyCell.className =
            "bg-white p-3";

        grid.appendChild(emptyCell);
    }


    /* =====================================
       建立日期
    ====================================== */

    for (let day = 1; day <= totalDays; day++) {

        const dateStr =
            `${currentYear}-${String(currentMonth + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;


        const cell =
            document.createElement("div");


        cell.className =
            "bg-white py-4 flex items-center justify-center cursor-pointer select-none transition";


        cell.innerText = day;


        cell.dataset.date = dateStr;


        grid.appendChild(cell);
    }


    /* =====================================
       啟動 Pointer Events
    ====================================== */

    setupPointerEvents(grid);
}



/* ============================================================
   判斷日期是否被其他人選取
============================================================ */

function isDateDisabledByOthers(dateStr) {

    for (const user in allUsersData) {

        if (user === currentUser) {
            continue;
        }


        const dates =
            allUsersData[user];


        if (
            Array.isArray(dates) &&
            dates.includes(dateStr)
        ) {

            return true;
        }
    }


    return false;
}



/* ============================================================
   Pointer Events
   同時支援：

   📱 手機
   🖱️ 滑鼠
   👆 點擊
   👉 滑動

============================================================ */

function setupPointerEvents(grid) {


    /*
     * 是否正在按住
     */
    let isPressing = false;


    /*
     * 滑動模式
     *
     * add    = 選取
     * remove = 取消
     */
    let dragMode = null;


    /*
     * 起點
     */
    let startX = 0;

    let startY = 0;

    let startCellDate = null;


    /*
     * 是否已經真正滑動
     */
    let isDragged = false;


    /*
     * =========================================
     * 滑動靈敏度
     *
     * 原本：8px
     *
     * 現在：3px
     *
     * 只要移動超過 3px
     * 就視為滑動
     * =========================================
     */

    const MOVE_THRESHOLD = 3;



    /* ========================================================
       取得滑鼠 / 手指所在日期
    ======================================================== */

    function getCellFromPoint(x, y) {

        const element =
            document.elementFromPoint(x, y);


        if (!element) {
            return null;
        }


        return element.closest(
            "#calendar-grid div[data-date]"
        );
    }



    /* ========================================================
       處理日期
    ======================================================== */

    function processDate(dateStr, mode) {

        if (!dateStr) {
            return;
        }


        /*
         * 如果是其他人已經選的日期
         * 不允許修改
         */
        if (isDateDisabledByOthers(dateStr)) {
            return;
        }


        if (mode === "add") {

            selectedDates.add(dateStr);

        }


        else if (mode === "remove") {

            selectedDates.delete(dateStr);

        }


        updateCalendarUI();
    }



    /* ========================================================
       開始按下
    ======================================================== */

    function handleStart(event) {

        /*
         * 只接受主要指標
         */
        if (!event.isPrimary) {
            return;
        }


        const cell =
            event.target.closest(
                "#calendar-grid div[data-date]"
            );


        /*
         * 如果不是日期格
         * 不處理
         */
        if (!cell) {
            return;
        }


        const dateStr =
            cell.dataset.date;


        /*
         * 其他人日期不能操作
         */
        if (isDateDisabledByOthers(dateStr)) {
            return;
        }


        isPressing = true;

        isDragged = false;


        startX = event.clientX;

        startY = event.clientY;


        startCellDate = dateStr;


        /*
         * 如果原本已經選取
         * 滑動就代表取消
         *
         * 如果原本沒有
         * 滑動就代表選取
         */

        dragMode =
            selectedDates.has(dateStr)
                ? "remove"
                : "add";


        /*
         * 捕捉目前 pointer
         *
         * 這樣手指離開日期格
         * 仍然可以繼續追蹤
         */

        try {

            grid.setPointerCapture(event.pointerId);

        } catch (error) {

            console.log(
                "Pointer Capture 不可用",
                error
            );

        }


        /*
         * 阻止瀏覽器預設行為
         */
        event.preventDefault();
    }



    /* ========================================================
       移動
    ======================================================== */

    function handleMove(event) {

        if (!isPressing) {
            return;
        }


        if (!event.isPrimary) {
            return;
        }


        const dx =
            Math.abs(
                event.clientX - startX
            );


        const dy =
            Math.abs(
                event.clientY - startY
            );


        /*
         * 超過 3px
         * 立即進入滑動模式
         */

        if (
            dx > MOVE_THRESHOLD ||
            dy > MOVE_THRESHOLD
        ) {


            /*
             * 第一次進入滑動
             */
            if (!isDragged) {

                isDragged = true;


                /*
                 * 起始日期也一起處理
                 */
                processDate(
                    startCellDate,
                    dragMode
                );
            }


            /*
             * 找目前手指位置
             */
            const cell =
                getCellFromPoint(
                    event.clientX,
                    event.clientY
                );


            if (cell) {

                processDate(
                    cell.dataset.date,
                    dragMode
                );
            }


            /*
             * 防止頁面滾動
             */
            event.preventDefault();
        }
    }



    /* ========================================================
       放開
    ======================================================== */

    function handleEnd(event) {

        if (!isPressing) {
            return;
        }


        /*
         * 如果沒有滑動
         *
         * 就代表「單純點擊」
         *
         * 點一下：
         * 沒選 → 選
         *
         * 已選 → 取消
         */

        if (
            !isDragged &&
            startCellDate
        ) {


            if (
                selectedDates.has(
                    startCellDate
                )
            ) {

                selectedDates.delete(
                    startCellDate
                );

            } else {

                selectedDates.add(
                    startCellDate
                );
            }


            updateCalendarUI();
        }


        /*
         * 重置
         */

        isPressing = false;

        isDragged = false;

        dragMode = null;

        startCellDate = null;


        try {

            if (
                grid.hasPointerCapture(
                    event.pointerId
                )
            ) {

                grid.releasePointerCapture(
                    event.pointerId
                );
            }

        } catch (error) {

            console.log(
                "Pointer Release Error",
                error
            );
        }
    }



    /* ========================================================
       Pointer Down
    ======================================================== */

    grid.addEventListener(
        "pointerdown",
        handleStart,
        {
            passive: false
        }
    );



    /* ========================================================
       Pointer Move
    ======================================================== */

    grid.addEventListener(
        "pointermove",
        handleMove,
        {
            passive: false
        }
    );



    /* ========================================================
       Pointer Up
    ======================================================== */

    grid.addEventListener(
        "pointerup",
        handleEnd,
        {
            passive: false
        }
    );



    /* ========================================================
       Pointer Cancel
    ======================================================== */

    grid.addEventListener(
        "pointercancel",
        handleEnd,
        {
            passive: false
        }
    );

}



/* ============================================================
   更新月曆畫面
============================================================ */

function updateCalendarUI() {

    const cells =
        document.querySelectorAll(
            "#calendar-grid div[data-date]"
        );


    cells.forEach(cell => {

        const dateStr =
            cell.dataset.date;


        /*
         * 先恢復原本狀態
         */

        cell.className =
            "bg-white py-4 flex items-center justify-center cursor-pointer select-none transition";


        /*
         * 自己選取
         */

        if (
            selectedDates.has(dateStr)
        ) {

            cell.classList.add(
                "selected-date"
            );

            return;
        }


        /*
         * 其他人選取
         */

        if (
            isDateDisabledByOthers(dateStr)
        ) {

            cell.classList.add(
                "disabled-by-others"
            );


            cell.classList.remove(
                "cursor-pointer"
            );
        }

    });
}



/* ============================================================
   進入 App
============================================================ */

async function enterApp() {

    const select =
        document.getElementById(
            "user-select"
        );


    if (!select.value) {

        alert(
            "請先選擇你的暱稱！"
        );

        return;
    }


    currentUser =
        select.value;


    document.getElementById(
        "current-user-tag"
    ).innerText =
        currentUser;


    const enterBtn =
        document.getElementById(
            "enter-btn"
        );


    if (!isDataFetched) {


        enterBtn.innerText =
            "載入雲端資料中...";


        enterBtn.disabled = true;


        await fetchLatestData();


        enterBtn.innerText =
            "進入填寫";


        enterBtn.disabled = false;


        isDataFetched = true;

    }

    else {

        loadUserDataToLocal();

        updateCalendarUI();

    }


    document.getElementById(
        "login-section"
    ).classList.add("hidden");


    document.getElementById(
        "app-section"
    ).classList.remove("hidden");
}



/* ============================================================
   登出
============================================================ */

function logout() {

    currentUser = "";

    selectedDates.clear();


    document.getElementById(
        "app-section"
    ).classList.add("hidden");


    document.getElementById(
        "login-section"
    ).classList.remove("hidden");


    document.getElementById(
        "user-select"
    ).value = "";
}



/* ============================================================
   取得 Google Sheet 資料
============================================================ */

async function fetchLatestData() {

    if (
        !WEB_APP_URL ||
        WEB_APP_URL === "https://script.google.com/macros/s/AKfycbyXsRlU9BUAIfOwg3MCR4Io4LzzuWsMiv9UZd99tKLsUrjbCCmljPACwMYfZmMuf0HTUw/exec"
    ) {

        alert(
            "請將程式碼中的 WEB_APP_URL 替換為有效的 Apps Script 網址！"
        );


        loadUserDataToLocal();

        updateCalendarUI();

        return;
    }



    try {

        const response =
            await fetch(
                WEB_APP_URL,
                {
                    method: "GET",
                    redirect: "follow"
                }
            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );
        }


        const result =
            await response.json();


        allUsersData =
            result || {};


        loadUserDataToLocal();

        updateCalendarUI();


    }

    catch (error) {

        console.error(
            "讀取資料失敗",
            error
        );


        alert(
            "無法取得雲端資料，請確認 API 網址或權限設定為「所有人」。"
        );


        loadUserDataToLocal();

        updateCalendarUI();
    }
}



/* ============================================================
   載入目前使用者資料
============================================================ */

function loadUserDataToLocal() {

    selectedDates.clear();


    if (
        allUsersData[currentUser] &&
        Array.isArray(
            allUsersData[currentUser]
        )
    ) {

        allUsersData[currentUser]
            .forEach(date => {

                selectedDates.add(date);

            });
    }
}



/* ============================================================
   送出資料
============================================================ */

async function submitData() {

    const submitBtn =
        document.getElementById(
            "submit-btn"
        );


    const datesArray =
        Array.from(
            selectedDates
        );


    /*
     * 先更新本地資料
     */

    allUsersData[currentUser] =
        datesArray;


    updateCalendarUI();


    const payload = {

        user: currentUser,

        dates: datesArray

    };


    try {

        submitBtn.innerText =
            "儲存中...";


        submitBtn.disabled = true;


        const response =
            await fetch(
                WEB_APP_URL,
                {
                    method: "POST",

                    body:
                        JSON.stringify(
                            payload
                        ),

                    redirect: "follow"
                }
            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );
        }


        alert(
            "儲存成功！"
        );


    }

    catch (error) {

        console.error(
            "儲存失敗",
            error
        );


        alert(
            "儲存失敗，請再試一次。"
        );

    }

    finally {

        submitBtn.innerText =
            "確認送出（覆蓋紀錄）";


        submitBtn.disabled = false;

    }

}



/* ============================================================
   啟動
============================================================ */

initCalendar();

</script>

</body>
</html>
